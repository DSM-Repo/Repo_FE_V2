name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit, typecheck, build, and E2E
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://api.repo.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Unit runner regression tests
        run: pnpm test:unit:runner

      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: E2E smoke
        run: pnpm test:e2e

      - name: Preserve failed E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
